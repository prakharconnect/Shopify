<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payment Success</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<style>
body{
    background:white;
    font-family: 'Segoe UI', sans-serif;
    color:#222;
}

.card{
    background:#fff;
    border:1px solid #e6e6e6;
    border-radius:14px;
    box-shadow:0 6px 20px rgba(0,0,0,0.08);
}

.check{
    font-size:70px;
    color:#28d65f;
    animation: pop .4s ease-out;
}

@keyframes pop{
    0%{transform:scale(0);}
    100%{transform:scale(1);}
}

.receipt-box{
    background:#fafafa;
    padding:18px;
    border-radius:10px;
    border:2px solid #ff6600;
}

h2,h3,h4{
    color:#111;
    font-weight:600;
}

.orange{
    color:#ff6600;
    font-weight:bold;
}

.btn-orange{
    background:#ff6600;
    border:none;
    font-weight:bold;
    color:white;
    padding:10px 18px;
    border-radius:6px;
}

.btn-orange:hover{
    background:#ff7f2a;
}
</style>
</head>

<body>

<div class="container mt-5">
    <div class="card p-4 mx-auto" style="max-width:650px;">
        <div class="text-center">
            <div class="check">✅</div>
            <h2 class="mt-2"><span class="orange">Payment Successful!</span></h2>
            <p style="font-size:16px;">Thank you for shopping with <b class="orange">Shopify</b> ❤️</p>
        </div>

        <div class="receipt-box mt-3" id="invoice-pdf">
            <h3 style="text-align:center;" class="orange">🧾 Order Invoice</h3>

            <p><b>Date:</b> <span id="inv-date"></span></p>
            <p><b>Email:</b> <span id="inv-email"></span></p>

            <hr>

            <div id="inv-items" style="line-height:1.6;"></div>

            <hr>
            <h4 style="text-align:right;">
                Total: <span class="orange">₹<span id="inv-total"></span></span>
            </h4>

            <p style="text-align:center;margin-top:10px;" class="orange">Thank you for shopping ❤️</p>
        </div>

        <div class="text-center mt-4">
            <button class="btn-orange" onclick="downloadInvoice()">Download Invoice (PDF)</button>
            <button class="btn btn-dark ms-2" onclick="window.location='index.html'">Continue Shopping</button>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>

<script>
let data = JSON.parse(localStorage.getItem("lastOrder"));

document.getElementById("inv-date").innerText = new Date().toLocaleDateString();
document.getElementById("inv-email").innerText = data.email;
document.getElementById("inv-total").innerText = data.total;

let itemsHtml = "";
data.items.forEach(i=>{
    itemsHtml += `<p>• ${i.name} x ${i.quantity} = ₹${i.price * i.quantity}</p>`;
});

document.getElementById("inv-items").innerHTML = itemsHtml;

function downloadInvoice(){
    const receiptElement = document.getElementById("invoice-pdf");
    const options = {
        margin: 10,
        filename: `Invoice-${Date.now()}.pdf`,
        image: { type: 'jpeg', quality: 1 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };
    html2pdf().from(receiptElement).set(options).save();
}
</script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
function launchConfetti() {
    var duration = 2 * 1000;
    var end = Date.now() + duration;

    (function frame() {
        confetti({
            particleCount: 5,
            angle: 60,
            spread: 55,
            origin: { x: 0 }
        });

        confetti({
            particleCount: 5,
            angle: 120,
            spread: 55,
            origin: { x: 1 }
        });

        if (Date.now() < end) {
            requestAnimationFrame(frame);
        }
    }());
}

launchConfetti();
</script>


</body>
</html>
